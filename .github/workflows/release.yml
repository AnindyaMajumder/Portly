name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make check cross
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: dist/checksums.txt

  # The documented install and uninstall commands, against the release just published
  installers:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
      TAG: ${{ github.ref_name }}
      # Releases before 1.0.0 are pre-releases, which releases/latest skips
      BASE: https://github.com/AnindyaMajumder/Portly/releases/download/${{ github.ref_name }}
    steps:
      - name: Version without the v
        shell: bash
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: curl | sh, on Windows through Git Bash
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = Windows ]; then bin="$(cygpath -u "$LOCALAPPDATA")/Programs/Portly/portly.exe"; else bin="$HOME/.local/bin/portly"; fi
          curl -fsSL "$BASE/install.sh" | PORTLY_VERSION="$VERSION" sh
          test "$("$bin" --version)" = "portly $VERSION"
          # update sees only full releases, so before 1.0.0 it must refuse and change nothing
          if "$bin" update --yes --json > update.json; then exit 1; fi
          grep -q '"code": "update_unavailable"' update.json
          test "$("$bin" --version)" = "portly $VERSION"
          curl -fsSL "$BASE/uninstall.sh" | sh
          test ! -e "$bin"
      - name: Windows PowerShell line from the README
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bin = Join-Path $env:LOCALAPPDATA 'Programs\Portly\portly.exe'
          $env:PORTLY_VERSION = $env:VERSION; curl.exe -fsSL "$env:BASE/install.ps1" | Out-String | iex
          if ((& $bin --version) -ne "portly $env:VERSION") { throw 'wrong version after install.ps1' }
          curl.exe -fsSL "$env:BASE/uninstall.ps1" | Out-String | iex
          if (Test-Path $bin) { throw 'uninstall.ps1 left portly behind' }
      - name: Windows cmd line from the README
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          powershell -NoProfile -Command "$env:PORTLY_VERSION='%VERSION%'; curl.exe -fsSL %BASE%/install.ps1 | Out-String | iex" || exit /b 1
          "%LOCALAPPDATA%\Programs\Portly\portly.exe" --version | findstr /x /c:"portly %VERSION%" || exit /b 1
          powershell -NoProfile -Command "curl.exe -fsSL %BASE%/uninstall.ps1 | Out-String | iex" || exit /b 1
          if exist "%LOCALAPPDATA%\Programs\Portly\portly.exe" exit /b 1
