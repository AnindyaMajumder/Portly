name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: make fmt vet arch lint vuln cover cross
      - run: make fuzz FUZZTIME=20s

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./internal/... ./tests/arch
      - run: go run ./cmd/portly --json
      - if: runner.os == 'Windows'
        env:
          GOARCH: "386"
        run: go test -count=1 ./internal/...

  emulated:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: ["386", arm, s390x]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - if: matrix.arch != '386'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go test -count=1 ./internal/domain ./internal/platform/... ./internal/modules/...

  linux-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Servers for the Linux evidence gate
        run: "pip install --only-binary :all: -r tests/e2e/gate-requirements.txt"
      - run: docker pull redis:7-alpine
      # The runner is a system service, so the tests move to their own scope
      - name: End to end, gate and containers
        run: >
          sudo -E env "PATH=$PATH" systemd-run --scope --quiet
          --uid="$(id -u)" --gid="$(id -g)" make e2e docker-test perf

  distros:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: for i in alpine:latest debian:stable-slim fedora:latest archlinux:latest opensuse/leap:latest; do docker pull -q "$i"; done
      - run: make distro-test
